<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator</title>
</head>

<body>

    <h1>Calculate Your Exact Age</h1>

    <form action="/calculate-age" method="POST">

        <label for="birthdate">
            Select your birthdate:
        </label>

        <br><br>

        <input
            type="date"
            id="birthdate"
            name="birthdate"
            required
        >

        <br><br>

        <button type="submit">
            Calculate Age
        </button>

    </form>

</body>

</html>
